name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Swift package
        run: swift build

      - name: Validate bundled payload
        run: swift run SiteBuilder --check

      - name: Run Swift tests
        run: swift test --package-path "$GITHUB_WORKSPACE"

      - name: Rebuild generated site
        run: swift run SiteBuilder

      - name: Ensure generated output is committed
        run: |
          if ! git diff --quiet; then
            git status --short
            echo "Generated site output is stale. Run 'swift run SiteBuilder' locally and commit the result."
            exit 1
          fi
